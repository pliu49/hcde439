<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, maximum-scale=1.0" />
    <title>Allen Liu's HCDE 439 Physical Computing Page!</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
      }
      h1 {
        text-align: center;
        margin: 1.5rem 0 1rem;
      }
      .header {
        text-align: center;
        padding: 1rem 0 0;
      }
      .header img {
        max-width: min(85vw, 560px);
        display: block;
        margin: 0 auto 1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
      }
      .assignment {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 1rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      }
      .assignment a {
        text-decoration: none;
        color: inherit;
      }
      .assignment h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
      }
      .assignment img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
        background: #eee;
      }
      .assignment p {
        margin: 0.8rem 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Allen Liu's HCDE 439 Physical Computing Page!</h1>

    <div class="header">
      <img src="IMG_7088.gif" alt="My blinking LED circuit on a breadboard connected to an Arduino Uno" />
    </div>

    <div class="grid">
      <div class="assignment">
        <a href="a1.html">
          <h2>Assignment 1: Blink!</h2>
          <img src="IMG_7088.gif" alt="Assignment 1 circuit" />
        </a>
        <p>Police-style holiday light.</p>
      </div>

      <div class="assignment">
        <a href="a2.html">
          <h2>Assignment 2: Fade!</h2>
          <img src="circuit.jpg" alt="Assignment 2 red panda" />
        </a>
        <p>Assignment 2!</p>
      </div>
    </div>
  </body>
</html>
