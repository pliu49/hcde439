<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Helvetica, Arial, sans-serif">
  <title>Assignment 3 schematic: photoresistor voltage divider drives a PWM DC motor fan</title>
  <rect width="960" height="550" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Sunroom fan: photoresistor voltage divider &#8594; Arduino Uno &#8594; PWM DC motor</text>

  <g stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Voltage divider (x = 150) ===== -->
    <!-- +5V rail symbol -->
    <line x1="125" y1="70" x2="175" y2="70"/>
    <line x1="150" y1="70" x2="150" y2="130"/>
    <!-- R1: photoresistor (zigzag inside a circle with light arrows) -->
    <circle cx="150" cy="190" r="46"/>
    <polyline points="150,130 150,150 162,156 138,168 162,180 138,192 162,204 138,216 150,222 150,250"/>
    <line x1="78" y1="128" x2="112" y2="156"/>
    <polyline points="100,156 112,156 112,144" />
    <line x1="64" y1="158" x2="98" y2="182"/>
    <polyline points="86,182 98,182 98,170" />
    <!-- V_measure node and wire to A0 -->
    <line x1="150" y1="250" x2="390" y2="250"/>
    <!-- R2: 10k fixed resistor -->
    <polyline points="150,250 150,285 162,291 138,303 162,315 138,327 162,339 138,351 150,357 150,395"/>
    <!-- ground under R2 -->
    <line x1="125" y1="395" x2="175" y2="395"/>
    <line x1="135" y1="404" x2="165" y2="404"/>
    <line x1="145" y1="413" x2="155" y2="413"/>

    <!-- ===== Arduino Uno box ===== -->
    <rect x="390" y="120" width="100" height="320" rx="8" fill="#f1f5f9"/>

    <!-- D9 -> R3 -> base -->
    <line x1="490" y1="200" x2="520" y2="200"/>
    <polyline points="520,200 530,200 535,188 547,212 559,188 571,212 583,188 590,200 610,200"/>
    <polyline points="610,200 610,300 695,300"/>

    <!-- ===== NPN transistor Q1 ===== -->
    <line x1="695" y1="276" x2="695" y2="324"/>
    <line x1="695" y1="288" x2="730" y2="262"/>
    <line x1="695" y1="312" x2="730" y2="338"/>
    <polygon points="730,338 714,336 722,326" fill="#111"/>
    <line x1="730" y1="262" x2="730" y2="198"/>
    <line x1="730" y1="338" x2="730" y2="395"/>
    <!-- ground under emitter -->
    <line x1="705" y1="395" x2="755" y2="395"/>
    <line x1="715" y1="404" x2="745" y2="404"/>
    <line x1="725" y1="413" x2="735" y2="413"/>

    <!-- ===== Motor M1 ===== -->
    <circle cx="730" cy="170" r="28" fill="#fff"/>
    <line x1="730" y1="142" x2="730" y2="100"/>
    <!-- +5V rail for motor -->
    <line x1="705" y1="100" x2="755" y2="100"/>

    <!-- ===== Flyback diode D1 (cathode toward +5V) ===== -->
    <polyline points="730,125 800,125 800,150"/>
    <polygon points="788,188 812,188 800,152" fill="#fff"/>
    <line x1="787" y1="152" x2="813" y2="152"/>
    <polyline points="800,188 800,230 730,230"/>
  </g>

  <!-- junction dots -->
  <g fill="#111">
    <circle cx="150" cy="250" r="5"/>
    <circle cx="730" cy="125" r="5"/>
    <circle cx="730" cy="230" r="5"/>
  </g>

  <!-- text: power labels -->
  <g font-size="15" fill="#111" font-weight="bold">
    <text x="150" y="58" text-anchor="middle">+5V</text>
    <text x="730" y="88" text-anchor="middle">+5V</text>
  </g>

  <!-- text: components -->
  <g font-size="14" fill="#111">
    <text x="206" y="178" font-weight="bold">R1 = photoresistor (LDR)</text>
    <text x="206" y="196">&#8776; 2 k&#937; bright, &#8776; 40 k&#937; dim</text>
    <text x="178" y="322" font-weight="bold">R2 = 10 k&#937;</text>
    <text x="178" y="340">fixed, to GND</text>
    <text x="196" y="238" font-weight="bold" fill="#b45309">V_measure</text>
    <text x="196" y="270" fill="#b45309">= 5 V &#215; R2 / (R1 + R2)</text>

    <text x="440" y="150" text-anchor="middle" font-weight="bold">Arduino Uno</text>
    <text x="402" y="255" font-weight="bold">A0</text>
    <text x="480" y="190" text-anchor="end" font-weight="bold">D9</text><text x="480" y="224" text-anchor="end" fill="#475569">(PWM)</text>

    <text x="560" y="176" text-anchor="middle" font-weight="bold">R3 = 1 k&#937;</text>
    <text x="560" y="236" text-anchor="middle" fill="#475569">base resistor</text>

    <text x="764" y="300" font-weight="bold">Q1 = NPN (PN2222)</text>
    <text x="764" y="318" fill="#475569">low-side switch</text>
    <text x="700" y="148" text-anchor="end" font-weight="bold">M1</text>
    <text x="700" y="128" text-anchor="end" fill="#475569">small DC motor + fan blade</text>
    <text x="822" y="166" font-weight="bold">D1</text>
    <text x="822" y="184" fill="#475569">1N4007 flyback</text>
  </g>

  <!-- M inside motor -->
  <text x="730" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">M</text>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <text x="40" y="470" font-weight="bold">Signal path</text>
    <text x="40" y="490">Light &#8593; &#8594; R1 falls &#8594; V_measure rises &#8594; analogRead(A0) rises &#8594; map() raises PWM on D9 &#8594; Q1 conducts longer &#8594; fan spins faster.</text>
    <text x="40" y="530">All +5V and GND symbols connect to the Uno's 5V and GND pins; the motor is assumed to draw about 200 mA or less.</text>
    <text x="40" y="510">Values from the firmware: pin A0 = divider, pin D9 = Q1 base through R3, 10 k&#937; divider resistor, 1 k&#937; base resistor.</text>
  </g>
</svg>
